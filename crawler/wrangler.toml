# The catalogue crawler is a Worker, not part of the Pages project, because
# Pages Functions cannot carry Cron Triggers. It binds the SAME D1 database as
# the site, so there is one catalogue rather than two.
#
#   cd crawler && npx wrangler deploy
#   npx wrangler secret put CRAWL_TOKEN   # gates the manual /run trigger
#
# Cron Triggers and the free plan's 100k requests/day both cost nothing, so this
# does not change the €0/month bill.

name = "coopq-crawler"
main = "index.js"
compatibility_date = "2026-08-01"

# No public URL. This Worker is driven entirely by its Cron Trigger, and leaving
# workers_dev on would otherwise demand a workers.dev subdomain be registered
# just to deploy a scheduled job. Its /run and /health handlers stay in the code
# for `wrangler dev --test-scheduled`; set this to true if you ever want them
# reachable from outside.
workers_dev = false

# Hourly, not nightly, and the reason is the platform rather than impatience: the
# Workers free plan caps subrequests at 50 per invocation, so one run can only
# touch ~13 games. A single nightly run would take almost a month to work through
# a 337-game catalogue. Hourly gives a full refresh roughly every day at a quarter
# of the request volume of the old */15 schedule — about 720 Steam requests a day,
# far below the ~200 / 5 min per-IP throttle that matters because Workers egress
# from a shared pool.
#
# Cron invocations themselves are free (100k/day), so frequency is a politeness
# question about Steam, not a cost one.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "g4m1ng"
database_id = "f16e7e1e-e2c3-463b-b1e4-158bc961de92"

[observability]
enabled = true
